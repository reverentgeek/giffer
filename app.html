<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Giffer</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="stylesheet" href="./node_modules/bulma/css/bulma.css">
	<link rel="stylesheet" href="./node_modules/@fortawesome/fontawesome-free/css/all.min.css">
	<style>
		[v-cloak] {
			display: none;
		}

		form,
		.navbar-item {
			width: 100%;
		}

		.empty-state {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: calc(100vh - 10rem);
		}
	</style>
</head>

<body class="has-navbar-fixed-top">
	<div id="app" v-cloak>
		<nav class="navbar is-fixed-top has-background-grey-light is-flex" role="navigation"
			aria-label="main navigation">
			<div class="navbar-item">
				<form v-on:submit.prevent="search">
					<div class="field has-addons">
						<div class="control is-expanded">
							<input v-model="searchTerm" id="searchText" class="input" type="text"
								placeholder="Search for a gif...">
						</div>
						<div class="control">
							<button id="searchButton" class="button is-primary">
								Search
							</button>
						</div>
					</div>
				</form>
			</div>
		</nav>
		<section class="section">
			<div class="container">
				<div v-if="gifs.length === 0" class="empty-state">
					<span class="icon is-large">
						<i v-if="searching" class="fas fa-3x fa-atom fa-spin"></i>
						<i v-else class="fas fa-3x fa-atom has-text-grey-lighter"></i>
					</span>
					<p v-if="error" class="has-text-danger mt-4">{{ error }}</p>
					<p v-else-if="lastSearch && !searching" class="has-text-grey mt-4">
						No gifs found for "{{ lastSearch }}"
					</p>
				</div>
				<div v-else class="columns is-multiline">
					<div v-for="gif in gifs" :key="gif.id" class="column is-one-third-tablet is-one-quarter-desktop">
						<div class="card">
							<div class="card-image">
								<figure class="image" @mouseenter="hoveredId = gif.id" @mouseleave="hoveredId = null">
									<img :src="hoveredId === gif.id ? gif.gif : gif.preview" :alt="gif.title">
									<div class="card-content is-overlay" v-if="hoveredId === gif.id">
										<button @click="copy(gif)" class="button is-small is-primary"
											:title="copiedId === gif.id ? 'Copied!' : 'Copy gif URL'">
											<span :class="copiedId === gif.id ? 'fas fa-check' : 'far fa-copy'"></span>
										</button>
									</div>
								</figure>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
	</div>
	<script src="app.js" type="module"></script>
</body>

</html>
