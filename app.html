<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Giffer</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="stylesheet" href="./node_modules/bulma/css/bulma.css">
	<style>
		[v-cloak] {
			display: none;
		}

		form,
		.navbar-item {
			width: 100%;
		}

		.empty-state {
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: calc(100vh - 8rem);
		}

		.gifs {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
			gap: 0.75rem;
		}

		.gif {
			position: relative;
			aspect-ratio: 1;
			padding: 0;
			border: 0;
			border-radius: var(--bulma-radius);
			background: var(--bulma-border-weak);
			overflow: hidden;
			cursor: pointer;
		}

		.gif img {
			display: block;
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.copied {
			position: absolute;
			inset: 0;
			display: grid;
			place-items: center;
			background: rgba(0, 0, 0, 0.6);
			color: #fff;
			font-weight: bold;
		}
	</style>
</head>

<body class="has-navbar-fixed-top">
	<div id="app" v-cloak>
		<nav class="navbar is-fixed-top has-shadow is-flex" role="navigation" aria-label="main navigation">
			<div class="navbar-item">
				<form v-on:submit.prevent="search">
					<div class="field has-addons">
						<div class="control is-expanded">
							<input v-model="searchTerm" ref="searchText" id="searchText" class="input" type="text"
								placeholder="Search for a gif..." aria-label="Search for a gif">
						</div>
						<div class="control">
							<button id="searchButton" class="button is-primary" :class="{ 'is-loading': searching }"
								:disabled="!searchTerm.trim()">
								Search
							</button>
						</div>
					</div>
				</form>
			</div>
		</nav>
		<section class="section p-4">
			<div v-if="gifs.length === 0" class="empty-state">
				<p v-if="error" class="has-text-danger">{{ error }}</p>
				<p v-else-if="!searching" class="has-text-grey">
					{{ lastSearch ? `No gifs found for "${ lastSearch }"` : "Search for a gif, then click it to copy its URL" }}
				</p>
			</div>
			<div v-else class="gifs">
				<button v-for="gif in gifs" :key="gif.id" class="gif" title="Click to copy gif URL" @click="copy(gif)"
					@mouseenter="activeId = gif.id" @mouseleave="activeId = null" @focus="activeId = gif.id"
					@blur="activeId = null">
					<img :src="activeId === gif.id ? gif.animated : gif.still" :alt="gif.title">
					<span v-if="copiedId === gif.id" class="copied">Copied!</span>
				</button>
			</div>
			<p class="has-text-centered has-text-grey is-size-7 mt-4">Powered by GIPHY</p>
		</section>
	</div>
	<script src="app.js" type="module"></script>
</body>

</html>
